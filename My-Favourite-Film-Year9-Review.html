<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>مراجعة: فيلمي المفضل – Year 9</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#ffffff;        /* text on colored buttons */
  --navy2:#eef3f8;       /* light input surface */
  --card:#ffffff;
  --card2:#eef3f8;
  --gold:#c8102e;        /* UAE red accent */
  --teal:#00843d;        /* UAE green primary */
  --coral:#c8102e;       /* red (wrong) */
  --green:#00843d;       /* green (correct) */
  --ink:#152233;         /* dark text */
  --muted:#5d6b7e;
  --line:rgba(21,34,51,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Tajawal',sans-serif;
  background:radial-gradient(1100px 600px at 85% -10%,#eafaf0 0%,#f4f8fc 45%,#ffffff 100%);
  color:var(--ink);
  overflow:hidden;
}
/* ---------- shell ---------- */
#stage{height:100dvh;display:flex;flex-direction:column}
header{
  display:flex;align-items:center;gap:12px;
  padding:10px 16px;border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.8);backdrop-filter:blur(6px);flex:0 0 auto;
}
.brand{font-family:'Cairo';font-weight:800;font-size:clamp(15px,2.4vw,20px);color:var(--gold)}
.brand small{display:block;font-weight:500;font-size:.62em;color:var(--muted);letter-spacing:.5px}
.progress{flex:1;height:8px;border-radius:99px;background:rgba(21,34,51,.10);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--gold));border-radius:99px;transition:width .4s}
.counter{font-family:'Cairo';font-weight:600;font-size:13px;color:var(--muted);min-width:54px;text-align:center}

main{flex:1;position:relative;overflow:hidden}
.slide{
  position:absolute;inset:0;padding:18px clamp(14px,4vw,48px);
  display:none;flex-direction:column;overflow-y:auto;
}
.slide.active{display:flex;animation:fade .45s ease}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.eyebrow{font-family:'Cairo';font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--teal);font-size:clamp(11px,1.5vw,14px)}
h1{font-family:'Cairo';font-weight:800;font-size:clamp(26px,5vw,46px);line-height:1.2;margin:.15em 0 .1em}
h2{font-family:'Cairo';font-weight:800;font-size:clamp(22px,3.6vw,34px);margin:.1em 0 .4em}
.sub{color:var(--muted);font-size:clamp(14px,1.9vw,18px);margin-bottom:14px}

footer{
  flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 16px;border-top:1px solid var(--line);background:rgba(255,255,255,.8);
}
.navbtn{
  font-family:'Cairo';font-weight:700;font-size:16px;border:none;cursor:pointer;
  padding:11px 22px;border-radius:14px;color:#fff;background:var(--green);
  display:flex;align-items:center;gap:8px;transition:transform .12s,opacity .2s;
}
.navbtn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.navbtn:active{transform:scale(.96)}
.navbtn:disabled{opacity:.3;cursor:default}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;flex:1}
.dot{width:9px;height:9px;border-radius:99px;background:rgba(21,34,51,.18);cursor:pointer;transition:.2s}
.dot.on{background:var(--green);transform:scale(1.3)}

/* ---------- generic cards ---------- */
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:680px){.g3{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:0 4px 18px rgba(21,34,51,.06)}
.tag{display:inline-flex;align-items:center;gap:7px;font-family:'Cairo';font-weight:700;font-size:14px;
  padding:7px 14px;border-radius:99px;background:rgba(0,132,61,.12);color:var(--teal)}
.translit{font-family:'Tajawal';direction:ltr;display:inline-block;font-size:13px;color:var(--gold);
  background:rgba(200,16,46,.10);padding:2px 10px;border-radius:99px;margin-top:4px}
.en{direction:ltr;color:var(--muted);font-size:14px}

/* speaker button */
.spk{border:none;cursor:pointer;background:rgba(0,132,61,.10);color:var(--teal);
  width:38px;height:38px;border-radius:12px;font-size:18px;display:grid;place-items:center;transition:.15s}
.spk:active{transform:scale(.9);background:var(--teal);color:#fff}

/* objectives / criteria list */
.checklist{display:flex;flex-direction:column;gap:10px}
.checklist li{list-style:none;display:flex;gap:12px;align-items:flex-start;
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 16px;
  font-size:clamp(15px,2vw,19px);cursor:pointer;transition:.18s}
.checklist li .mk{flex:0 0 auto;width:26px;height:26px;border-radius:8px;border:2px solid var(--muted);
  display:grid;place-items:center;color:transparent;font-weight:900;transition:.18s}
.checklist li.done{border-color:var(--green);background:rgba(0,132,61,.10)}
.checklist li.done .mk{background:var(--green);border-color:var(--green);color:#fff}

/* vocab */
.vcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;
  display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;cursor:pointer;transition:.18s;position:relative}
.vcard:active{transform:scale(.97)}
.vcard .ar{font-family:'Cairo';font-weight:800;font-size:clamp(20px,3vw,26px)}
.vcard .reveal{opacity:0;max-height:0;overflow:hidden;transition:.3s}
.vcard.show .reveal{opacity:1;max-height:80px}
.vcard .hint{font-size:12px;color:var(--muted)}
.vcard.show .hint{display:none}
.vcard .spk{position:absolute;top:8px;left:8px;width:32px;height:32px;font-size:15px}

/* text passage */
.passage{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;
  font-size:clamp(16px,2.3vw,22px);line-height:2.05;font-weight:500}
.passage b{color:var(--gold);font-weight:800;cursor:pointer;border-bottom:2px dotted var(--gold)}

/* grammar transform */
.tf{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;
  background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;font-family:'Cairo'}
.tf .from{font-size:clamp(20px,3vw,28px);font-weight:700;color:var(--muted)}
.tf .arrow{color:var(--teal);font-size:24px}
.tf .to{font-size:clamp(22px,3.4vw,32px);font-weight:800}
.tf .to .s{color:var(--gold)}

/* T/F + MCQ */
.q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.q .stem{font-size:clamp(16px,2.2vw,21px);font-weight:600;margin-bottom:10px;line-height:1.7}
.opts{display:flex;gap:10px;flex-wrap:wrap}
.opt{font-family:'Cairo';font-weight:700;border:1px solid var(--line);background:var(--card2);color:var(--ink);
  padding:10px 18px;border-radius:12px;cursor:pointer;font-size:16px;transition:.15s;flex:1;min-width:90px;text-align:center}
.opt:active{transform:scale(.97)}
.opt.correct{background:var(--green);color:var(--navy);border-color:var(--green)}
.opt.wrong{background:var(--coral);color:#fff;border-color:var(--coral)}

/* fill blanks / complete */
.fill{display:flex;flex-direction:column;gap:12px}
.fill .row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 16px;
  font-size:clamp(15px,2.1vw,20px);line-height:1.8;cursor:pointer;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.blk{display:inline-block;min-width:90px;border-bottom:2px dashed var(--muted);color:transparent;
  text-align:center;font-weight:800;transition:.2s}
.fill .row.open .blk{color:var(--gold);border-bottom-style:solid;border-bottom-color:var(--gold)}
.fill .row .ans{opacity:0;font-size:13px;color:var(--green);transition:.2s}
.fill .row.open .ans{opacity:1}

/* arrange (drag) */
.arrange{display:flex;flex-direction:column;gap:14px}
.aset{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.answer{display:flex;gap:8px;flex-wrap:wrap;min-height:54px;align-items:center;
  background:var(--navy2);border:2px dashed var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.answer:empty::before{content:'اضغط الكلمات بالترتيب الصحيح';color:var(--muted);font-size:14px}
.bank{display:flex;gap:8px;flex-wrap:wrap;min-height:44px;align-items:center}
.word{font-family:'Cairo';font-weight:700;background:var(--card2);border:1px solid var(--line);
  padding:9px 16px;border-radius:11px;font-size:clamp(15px,2vw,19px);cursor:pointer;user-select:none;transition:.12s}
.word:active{transform:scale(.94)}
.word.placed{background:rgba(0,132,61,.12);border-color:var(--teal);color:var(--teal)}
.word.used{opacity:.25;pointer-events:none}
.aset.solved{border-color:var(--green);background:rgba(0,132,61,.08)}
.aset.solved .answer{border-style:solid;border-color:var(--green)}
.arow{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap}
.aset .chk{font-family:'Cairo';font-weight:700;font-size:14px;border:none;cursor:pointer;
  background:var(--teal);color:#fff;padding:8px 18px;border-radius:10px}
.aset .reset{font-family:'Cairo';font-weight:700;font-size:14px;border:1px solid var(--line);cursor:pointer;
  background:transparent;color:var(--muted);padding:8px 14px;border-radius:10px}
.aset .fb{font-size:15px;font-weight:700;margin-inline-start:auto}

/* writing / speaking */
.starter{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.starter .lead{font-family:'Cairo';font-weight:800;font-size:clamp(17px,2.3vw,22px);color:var(--gold);margin-bottom:8px}
.modelbtn{margin-top:8px;font-family:'Cairo';font-weight:700;font-size:13px;border:1px solid var(--teal);
  background:transparent;color:var(--teal);padding:6px 14px;border-radius:10px;cursor:pointer}
.model{margin-top:8px;background:rgba(0,132,61,.08);border:1px solid rgba(0,132,61,.25);border-radius:10px;
  padding:10px 14px;font-size:15px;line-height:1.8;display:none}
.model.show{display:block}
.model .lbl{font-family:'Cairo';font-weight:700;font-size:12px;color:var(--teal);display:block;margin-bottom:4px}
textarea{width:100%;background:var(--navy2);border:1px solid var(--line);border-radius:12px;color:var(--ink);
  font-family:'Tajawal';font-size:17px;padding:12px;resize:vertical;min-height:70px;direction:rtl}
.spkcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;
  display:flex;align-items:center;gap:14px;font-size:clamp(17px,2.4vw,23px);font-weight:700;font-family:'Cairo'}

/* translation */
.trrow{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;cursor:pointer}
.trrow .ar{font-size:clamp(16px,2.2vw,21px);font-weight:600;line-height:1.8}
.trrow .tr{direction:ltr;color:var(--teal);font-size:15px;margin-top:8px;opacity:0;max-height:0;overflow:hidden;transition:.3s}
.trrow.open .tr{opacity:1;max-height:120px;margin-top:8px}
.trrow .cue{font-size:12px;color:var(--muted);margin-top:6px}
.trrow.open .cue{display:none}

/* game links */
.glink{display:flex;align-items:center;gap:14px;text-decoration:none;background:var(--card);
  border:1px solid var(--line);border-radius:16px;padding:16px 18px;color:var(--ink);transition:.15s;margin-bottom:12px}
.glink:active{transform:scale(.98)}
.glink .ic{flex:0 0 auto;width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-size:24px;font-weight:900;font-family:'Cairo'}
.glink b{font-family:'Cairo';font-size:18px;display:block}
.glink span{font-size:13px;color:var(--muted);direction:ltr}

/* assessment badge */
.afl{display:inline-flex;align-items:center;gap:7px;font-family:'Cairo';font-weight:700;font-size:12px;
  padding:5px 12px;border-radius:99px;margin-bottom:10px}
.afl.for{background:rgba(0,132,61,.12);color:var(--green)}
.afl.as{background:rgba(200,16,46,.10);color:var(--gold)}
.afl.of{background:rgba(21,34,51,.10);color:var(--ink)}

.wm{text-align:center;font-family:'Cairo';font-weight:700;color:var(--muted);font-size:13px;margin-top:auto;padding-top:14px}
.scrollwrap{flex:1;min-height:0}
.vcard,.q,.glink,.passage,.aset,.fill .row,.starter,.spkcard,.trrow,.tf,.checklist li{box-shadow:0 3px 14px rgba(21,34,51,.05)}
</style>
</head>
<body>
<div id="stage">
  <header>
    <div class="brand">فيلمي المفضل <small>My Favourite Film • Year 9 · Review</small></div>
    <div class="progress"><i id="bar"></i></div>
    <div class="counter" id="count">1 / 16</div>
  </header>

  <main id="main"><!-- slides injected --></main>

  <footer>
    <button class="navbtn ghost" id="prev">السابق ›</button>
    <div class="dots" id="dots"></div>
    <button class="navbtn" id="next">‹ التالي</button>
  </footer>
</div>

<script>
/* ============ speech (iOS / Safari hardened) ============ */
const hasTTS = 'speechSynthesis' in window;
let arVoice=null, voiceTries=0, primed=false;
function loadVoices(){
  if(!hasTTS)return;
  const v=speechSynthesis.getVoices()||[];
  const found=v.find(x=>x.lang&&/^ar/i.test(x.lang));
  if(found)arVoice=found;
  // some browsers populate voices late — retry a few times
  if(!arVoice && voiceTries<8){voiceTries++;setTimeout(loadVoices,400);}
  if(v.length)checkVoiceHint(v);
}
if(hasTTS){speechSynthesis.onvoiceschanged=loadVoices;loadVoices();}
// iOS needs the engine "woken up" by a real user gesture before it will speak
function prime(){
  if(primed||!hasTTS)return;primed=true;
  try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u);}catch(e){}
}
document.addEventListener('touchend',prime,{once:true,passive:true});
document.addEventListener('click',prime,{once:true});
function speak(t){
  if(!hasTTS){return;}
  prime();
  try{speechSynthesis.cancel();}catch(e){}
  const u=new SpeechSynthesisUtterance(t);
  u.lang='ar-SA';u.rate=.8;u.pitch=1;u.volume=1;
  if(arVoice)u.voice=arVoice;
  speechSynthesis.speak(u); // must stay synchronous inside the tap (iOS)
}
// one-time gentle hint if the device has NO Arabic voice installed
let hintShown=false;
function checkVoiceHint(list){
  if(hintShown)return;
  const hasAr=list.some(x=>x.lang&&/^ar/i.test(x.lang));
  if(hasAr)return;
  hintShown=true;
  const b=document.createElement('div');
  b.style.cssText='position:fixed;left:12px;right:12px;bottom:70px;z-index:99;background:#152233;color:#fff;'
    +'font-family:Tajawal,sans-serif;font-size:14px;line-height:1.7;padding:12px 16px;border-radius:14px;'
    +'box-shadow:0 6px 24px rgba(0,0,0,.25);text-align:center';
  b.innerHTML='🔊 لتشغيل الصوت العربي: الإعدادات ← إمكانية الوصول ← المحتوى المنطوق ← الأصوات ← العربية (نزّلي صوتًا)، وتأكدي إن مفتاح الصامت مقفول والصوت مرتفع. '
    +'<button style="margin-inline-start:8px;background:#00843d;color:#fff;border:none;border-radius:8px;padding:4px 12px;font-family:inherit;cursor:pointer">تمام</button>';
  b.querySelector('button').onclick=()=>b.remove();
  document.body.appendChild(b);
}

/* ============ data ============ */
const vocab=[
  ['يُفَضِّل','prefers','yufaDDil'],['تُشَاهِد','watches','tushaahid'],
  ['الجَدِيدَة','the new','al-jadiida'],['مُمْتِعَة','enjoyable','mumti3a'],
  ['يَضْحَك','laughs','yaDHak'],['قِصَص','stories','qisas'],
  ['مُسَلِّيَة','entertaining','musalliya'],['أَحْدَاث','events','aHdaath'],
  ['شَيِّقَة','interesting','shayyiqa'],['الرُّعْب','horror','ar-ru3b'],
  ['مُنَاسِبَة','suitable','munaasiba'],['نِهَايَة الأُسْبُوع','weekend','nihaayat al-usbuu3']
];

const tf=[
  ['يُوسُف طَالِبٌ فِي الصَّفِّ التَّاسِعِ.',true],
  ['تُشَاهِدُ الأُسْرَةُ الأَفْلَامَ فِي الْبَيْتِ.',false],
  ['سَارَةُ تَخْتَارُ أَفْلَامَ الرُّعْبِ لِأَنَّ فِيهَا تَشْوِيقًا.',true],
  ['إِبْرَاهِيمُ يُحِبُّ الأَفْلَامَ الْكُومِيدِيَّةَ.',false],
  ['آدَمُ يُحِبُّ الْمُغَامَرَةَ لِأَنَّ أَحْدَاثَهَا سَرِيعَةٌ.',true]
];

const mcq=[
  ['أَيْنَ تَعِيشُ أُسْرَةُ يُوسُف؟',['أَبُوظَبِي','دُبَي','الشَّارِقَة'],1],
  ['مَتَى وَأَيْنَ تُشَاهِدُ الأُسْرَةُ الأَفْلَامَ؟',['كُلَّ يَوْمٍ فِي الْبَيْتِ','فِي السِّينَمَا — نِهَايَةَ الأُسْبُوعِ','فِي الإِنْتَرْنِت يَوْمِيًّا'],1],
  ['لِمَاذَا يُحِبُّ الأَبُ الْكُومِيدِيَّةَ؟',['لِأَنَّهَا مُخِيفَة','لِأَنَّ قِصَصَهَا جَمِيلَة','لِأَنَّهَا مُمْتِعَة وَيُحِبُّ أَنْ يَضْحَك'],2],
  ['مَنْ يُحِبُّ أَفْلَامَ الأَنِيمِيشَن؟',['سَارَة','صُوفِي','إِبْرَاهِيم'],1]
];

const blanks=[
  ['تُشَاهِدُ الأُسْرَةُ الأَفْلَامَ فِي','السِّينَمَا'],
  ['الأَبُ يُحِبُّ الأَفْلَامَ','الْكُومِيدِيَّةَ'],
  ['الأَبُ يُحِبُّ الْكُومِيدِيَّةَ لِأَنَّهُ يُحِبُّ أَنْ','يَضْحَكَ'],
  ['صُوفِي تُحِبُّ الأَنِيمِيشَن لِأَنَّهَا','مُنَاسِبَة'],
  ['إِبْرَاهِيم يُحِبُّ الْخَيَالِيَّةَ لِأَنَّهَا مُرْتَبِطَة','بِالتَّكْنُولُوجِيا']
];

const arrange=[
  ['تَعِيشُ','أُسْرَةُ','يُوسُف','فِي','دُبَي'],
  ['يُحِبُّ','الأَبُ','الأَفْلَامَ','الْكُومِيدِيَّةَ'],
  ['تُشَاهِدُ','الأُمُّ','الأَفْلَامَ','الْعَاطِفِيَّةَ'],
  ['سَارَةُ','تَخْتَارُ','أَفْلَامَ','الرُّعْبِ'],
  ['صُوفِي','تُحِبُّ','أَفْلَامَ','الأَنِيمِيشَن']
];

const translate=[

// arrange — TAP to place words in order (reliable on iPad, no drag)
const aq=document.getElementById('arrq');
arrange.forEach(correct=>{
  const shuffled=[...correct].sort(()=>Math.random()-.5);
  const set=document.createElement('div');set.className='aset';
  const answer=document.createElement('div');answer.className='answer';
  const bank=document.createElement('div');bank.className='bank';
  const row=document.createElement('div');row.className='arow';
  const btn=document.createElement('button');btn.className='chk';btn.textContent='تحقّق ✓';
  const reset=document.createElement('button');reset.className='reset';reset.textContent='مسح ↺';
  const fb=document.createElement('div');fb.className='fb';
  row.append(btn,reset,fb);
  set.append(answer,bank,row);aq.appendChild(set);

  // build bank chips
  shuffled.forEach(w=>{
    const chip=document.createElement('div');chip.className='word';chip.textContent=w;
    chip.onclick=()=>{ // move bank -> answer
      if(chip.classList.contains('used'))return;
      chip.classList.add('used');
      const placed=document.createElement('div');placed.className='word placed';placed.textContent=w;
      placed.onclick=()=>{ // tap placed -> return to bank
        placed.remove();chip.classList.remove('used');clearFb();
      };
      answer.appendChild(placed);clearFb();
    };
    bank.appendChild(chip);
  });
  function clearFb(){fb.textContent='';set.classList.remove('solved');}
  reset.onclick=()=>{
    answer.innerHTML='';bank.querySelectorAll('.word').forEach(c=>c.classList.remove('used'));clearFb();
  };
  btn.onclick=()=>{
    const cur=[...answer.querySelectorAll('.word')].map(x=>x.textContent);
    if(cur.length<correct.length){fb.textContent='أكملي الجملة أولاً';fb.style.color='var(--muted)';return;}
    const ok=cur.join('|')===correct.join('|');
    fb.textContent=ok?'✅ ممتاز!':'❌ حاولي مرة أخرى';
    fb.style.color=ok?'var(--green)':'var(--coral)';
    set.classList.toggle('solved',ok);
    if(ok)speak(correct.join(' '));
  };
});

});

/* ============ navigation ============ */
let idx=0;const total=S.length;
const slides=[...document.querySelectorAll('.slide')];
const dots=document.getElementById('dots');
slides.forEach((_,i)=>{const d=document.createElement('span');d.className='dot'+(i===0?' on':'');d.onclick=()=>go(i);dots.appendChild(d);});
const dotEls=[...dots.children];
function go(i){
  if(i<0||i>=total)return;
  if('speechSynthesis' in window)speechSynthesis.cancel();
  slides[idx].classList.remove('active');dotEls[idx].classList.remove('on');
  idx=i;
  slides[idx].classList.add('active');dotEls[idx].classList.add('on');
  slides[idx].querySelector('.scrollwrap').scrollTop=0;
  document.getElementById('bar').style.width=((idx+1)/total*100)+'%';
  document.getElementById('count').textContent=`${idx+1} / ${total}`;
  document.getElementById('prev').disabled=idx===0;
  document.getElementById('next').disabled=idx===total-1;
}
document.getElementById('next').onclick=()=>go(idx+1);
document.getElementById('prev').onclick=()=>go(idx-1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(idx+1);if(e.key==='ArrowRight')go(idx-1);});
go(0);
</script>
