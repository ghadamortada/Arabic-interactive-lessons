<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talking Arabic Alphabet Map</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;900&family=Fraunces:ital,wght@0,400;0,700;1,400&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* Colors pulled directly from the map */
  :root {
    --map-teal: #6fb3a8;        /* sea/background */
    --map-teal-dark: #4d9a8e;
    --map-coral: #d8584a;       /* red pins */
    --map-orange: #e9a85b;      /* orange pins */
    --map-olive: #a3a657;       /* olive green pins */
    --map-pink: #e8a5a0;        /* pink pins */
    --map-sand: #f1e3c8;        /* sandy road */
    --map-sand-dark: #c9a876;
    --ink: #2a2a2a;
    --paper: #faf6f0;
    --shadow: 0 8px 32px rgba(42, 42, 42, 0.15);
    --shadow-lg: 0 20px 60px rgba(42, 42, 42, 0.25);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Cairo', sans-serif;
    background: linear-gradient(180deg, #b8d8d2 0%, #95c4bc 100%);
    color: var(--ink);
    min-height: 100vh;
    position: relative;
  }

  /* Subtle decorative pattern */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(circle at 10% 90%, rgba(255,255,255,0.15) 0%, transparent 50%),
      radial-gradient(circle at 90% 10%, rgba(255,255,255,0.1) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 30px 20px;
    position: relative;
    z-index: 1;
  }

  header {
    text-align: center;
    margin-bottom: 24px;
    padding: 20px;
  }

  /* Title in dashed box like the original map */
  .title-box {
    display: inline-block;
    background: var(--paper);
    border: 3px dashed var(--ink);
    padding: 20px 36px;
    border-radius: 8px;
    box-shadow: var(--shadow);
    margin-bottom: 18px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-size: clamp(1.6rem, 4vw, 2.6rem);
    font-weight: 700;
    line-height: 1.15;
    color: var(--ink);
    letter-spacing: 1px;
  }

  .instruction-banner {
    background: var(--paper);
    color: var(--ink);
    padding: 14px 28px;
    border-radius: 50px;
    box-shadow: var(--shadow);
    display: inline-flex;
    align-items: center;
    gap: 12px;
    font-weight: 600;
    font-size: 1rem;
    font-family: 'Fraunces', serif;
    border: 2px solid var(--map-coral);
    margin-bottom: 14px;
  }

  .instruction-banner .icon {
    font-size: 1.4rem;
  }

  .teacher-credit {
    margin-top: 10px;
    font-size: 0.9rem;
    color: var(--ink);
    opacity: 0.7;
    font-family: 'Caveat', cursive;
    font-size: 1.1rem;
  }

  /* Audio test bar */
  .audio-bar {
    background: var(--paper);
    padding: 12px 20px;
    border-radius: 50px;
    box-shadow: var(--shadow);
    display: inline-flex;
    align-items: center;
    gap: 12px;
    margin-top: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .audio-status {
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 0.85rem;
    background: #fff3cd;
    color: #856404;
    font-weight: 600;
  }

  .test-btn {
    background: var(--map-coral);
    color: white;
    border: none;
    padding: 8px 20px;
    border-radius: 30px;
    font-family: 'Cairo', sans-serif;
    font-weight: 700;
    cursor: pointer;
    font-size: 0.9rem;
    box-shadow: 0 3px 10px rgba(216, 88, 74, 0.3);
    transition: all 0.2s;
  }
  .test-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(216, 88, 74, 0.4);
  }

  .speed-control {
    background: var(--map-sand);
    padding: 6px 14px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    font-weight: 600;
  }
  .speed-control select {
    border: 1px solid var(--map-sand-dark);
    background: white;
    padding: 3px 8px;
    border-radius: 14px;
    font-family: 'Cairo', sans-serif;
    cursor: pointer;
    font-weight: 600;
  }

  /* Map container */
  .map-image-wrap {
    position: relative;
    width: 100%;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: var(--shadow-lg);
    background: white;
    line-height: 0;
    border: 4px solid var(--paper);
  }

  .map-image {
    width: 100%;
    height: auto;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
  }

  .map-hotspot {
    position: absolute;
    width: 6.5%;
    aspect-ratio: 1 / 1;
    transform: translate(-50%, -50%);
    background: transparent;
    border: 3px solid transparent;
    border-radius: 50%;
    cursor: pointer;
    transition: all 0.25s ease;
    padding: 0;
    z-index: 2;
  }

  .map-hotspot:hover {
    background: rgba(255, 230, 0, 0.30);
    border-color: rgba(255, 200, 0, 0.95);
    box-shadow: 0 0 24px rgba(255, 200, 0, 0.6);
  }

  .map-hotspot:active {
    transform: translate(-50%, -50%) scale(0.92);
  }

  .map-hotspot.playing {
    background: rgba(216, 88, 74, 0.30);
    border-color: var(--map-coral);
    animation: hotspotPulse 1s ease infinite;
  }

  @keyframes hotspotPulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.12); }
  }

  .hotspot-tooltip {
    position: absolute;
    bottom: 110%;
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--paper);
    padding: 4px 12px;
    border-radius: 12px;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 0.85rem;
    font-weight: 700;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }

  .map-hotspot:hover .hotspot-tooltip {
    opacity: 1;
  }

  footer {
    text-align: center;
    padding: 30px 20px;
    color: var(--ink);
    opacity: 0.7;
    font-size: 0.9rem;
    font-family: 'Fraunces', serif;
    font-style: italic;
  }

  footer .heart {
    color: var(--map-coral);
  }

  @media (max-width: 700px) {
    .map-hotspot { width: 8%; border-width: 2px; }
    .title-box { padding: 14px 22px; }
    h1 { font-size: 1.4rem; }
    .audio-bar { flex-direction: column; }
  }

  /* Print button — teal accent to differentiate from coral audio button */
  .print-btn {
    background: var(--map-teal-dark);
    color: white;
    border: none;
    padding: 8px 20px;
    border-radius: 30px;
    font-family: 'Cairo', sans-serif;
    font-weight: 700;
    cursor: pointer;
    font-size: 0.9rem;
    box-shadow: 0 3px 10px rgba(77, 154, 142, 0.35);
    transition: all 0.2s;
  }
  .print-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(77, 154, 142, 0.5);
    background: var(--map-teal);
  }

  /* Print Worksheet button — orange accent for blank worksheet */
  .print-worksheet-btn {
    background: var(--map-orange);
    color: var(--ink);
    border: none;
    padding: 8px 20px;
    border-radius: 30px;
    font-family: 'Cairo', sans-serif;
    font-weight: 700;
    cursor: pointer;
    font-size: 0.9rem;
    box-shadow: 0 3px 10px rgba(233, 168, 91, 0.4);
    transition: all 0.2s;
    margin-left: 8px;
  }
  .print-worksheet-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(233, 168, 91, 0.55);
    background: #f0b870;
  }

  /* ===== PRINT STYLES ===== */
  @media print {
    @page {
      size: A4;
      margin: 10mm;
    }

    body {
      background: white !important;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    body::before { display: none !important; }

    .container {
      max-width: 100% !important;
      padding: 0 !important;
    }

    header {
      margin-bottom: 8px !important;
      padding: 4px !important;
      page-break-after: avoid;
    }

    .title-box {
      box-shadow: none !important;
      padding: 8px 20px !important;
      margin-bottom: 6px !important;
    }

    h1 {
      font-size: 1.4rem !important;
      line-height: 1.1 !important;
    }

    /* Hide all interactive controls when printing */
    .instruction-banner,
    .audio-bar,
    .print-worksheet-btn,
    footer {
      display: none !important;
    }

    .teacher-credit {
      font-size: 0.95rem !important;
      margin-top: 4px !important;
      opacity: 1 !important;
    }

    .map-image-wrap {
      box-shadow: none !important;
      border: 2px solid var(--ink) !important;
      border-radius: 12px !important;
      page-break-inside: avoid;
      max-width: 100%;
    }

    .map-image {
      width: 100% !important;
      height: auto !important;
      max-height: 85vh;
      object-fit: contain;
    }

    /* Hide hotspot circles and tooltips — the printed map should be clean */
    .map-hotspot {
      display: none !important;
    }
  }
</style>
</head>

  }

  function speakWithGoogle(text, cardEl) {
    // Stop any current speech
    if (window.speechSynthesis) {
      window.speechSynthesis.cancel();
    }

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'ar-SA';
    utterance.rate = speed;

    // Try to pick an Arabic voice if available
    const voices = window.speechSynthesis.getVoices();
    const arabicVoice = voices.find(v => v.lang && v.lang.startsWith('ar'));
    if (arabicVoice) {
      utterance.voice = arabicVoice;
    }

    if (cardEl) {
      cardEl.classList.add('playing');
      utterance.onend = () => cardEl.classList.remove('playing');
      utterance.onerror = () => cardEl.classList.remove('playing');
    }

    window.speechSynthesis.speak(utterance);
  }

  function speak(text, cardEl) {
    speakWithGoogle(text, cardEl);
  }

      speak(letter.sound, btn);
      setTimeout(() => btn.classList.remove('playing'), 1500);
