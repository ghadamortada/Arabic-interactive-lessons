<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arabic Alphabet Map - Practice Worksheet</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;900&family=Fraunces:ital,wght@0,400;0,700;1,400&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --map-teal: #6fb3a8;
    --map-teal-dark: #4d9a8e;
    --map-coral: #d8584a;
    --map-sand: #f1e3c8;
    --ink: #2a2a2a;
    --paper: #faf6f0;
    --shadow: 0 8px 32px rgba(42, 42, 42, 0.15);
    --shadow-lg: 0 20px 60px rgba(42, 42, 42, 0.25);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Cairo', sans-serif;
    background: linear-gradient(180deg, #b8d8d2 0%, #95c4bc 100%);
    color: var(--ink);
    min-height: 100vh;
  }

  .container {
    max-width: 1300px;
    margin: 0 auto;
    padding: 30px 20px;
  }

  .screen-header {
    text-align: center;
    margin-bottom: 24px;
    padding: 20px;
  }

  .title-box {
    display: inline-block;
    background: var(--paper);
    border: 3px dashed var(--ink);
    padding: 18px 32px;
    border-radius: 8px;
    box-shadow: var(--shadow);
    transform: rotate(-1deg);
    margin-bottom: 14px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-size: clamp(1.4rem, 3.5vw, 2.2rem);
    font-weight: 700;
    line-height: 1.15;
    color: var(--ink);
    letter-spacing: 1px;
  }

  .subtitle {
    color: var(--ink);
    opacity: 0.7;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 1rem;
    margin-bottom: 16px;
  }

  .controls-bar {
    background: var(--paper);
    padding: 16px 24px;
    border-radius: 50px;
    box-shadow: var(--shadow);
    display: inline-flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
    justify-content: center;
    border: 2px solid var(--map-coral);
  }

  .print-btn {
    background: var(--map-coral);
    color: white;
    border: none;
    padding: 12px 26px;
    border-radius: 30px;
    font-family: 'Cairo', sans-serif;
    font-weight: 700;
    cursor: pointer;
    font-size: 1rem;
    box-shadow: 0 4px 12px rgba(216, 88, 74, 0.35);
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .print-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(216, 88, 74, 0.45);
  }

  .instructions-text {
    color: var(--ink);
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 0.95rem;
  }

  .print-sheet {
    background: white;
    width: 100%;
    aspect-ratio: 1.414 / 1;
    margin: 0 auto;
    border-radius: 12px;
    box-shadow: var(--shadow-lg);
    overflow: hidden;
    position: relative;
    border: 4px solid var(--paper);
  }

  .print-header {
    background: var(--paper);
    padding: 14px 24px;
    border-bottom: 2px dashed var(--ink);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }

  .print-header-title {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 1.1rem;
    color: var(--ink);
    letter-spacing: 0.5px;
  }

  .print-header-fields {
    display: flex;
    gap: 18px;
    align-items: center;
    font-family: 'Fraunces', serif;
    font-size: 0.95rem;
    color: var(--ink);
  }

  .print-header-fields .field {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .print-header-fields .field-line {
    display: inline-block;
    width: 140px;
    border-bottom: 1.5px solid var(--ink);
    height: 18px;
  }

  .map-image-wrap {
    position: relative;
    width: 100%;
    height: calc(100% - 60px);
    line-height: 0;
    background: #95c4bc;
  }

  .map-image {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
  }

  @media print {
    @page {
      size: A4 landscape;
      margin: 0.5cm;
    }
    body {
      background: white;
      padding: 0;
    }
    .screen-header,
    .controls-bar-wrap {
      display: none !important;
    }
    .container {
      max-width: 100%;
      padding: 0;
    }
    .print-sheet {
      width: 100%;
      height: 100vh;
      aspect-ratio: auto;
      box-shadow: none;
      border-radius: 0;
      border: none;
      page-break-inside: avoid;
    }
    .map-image-wrap {
      height: calc(100% - 55px);
    }
  }
</style>
</head>

<div class="container">
